<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Sync</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><span>R</span><div><strong>Cookie Sync</strong><small>Gemini Rust Gateway</small></div></header>
    <label>本地网关地址<input id="gateway" value="http://127.0.0.1:8000" spellcheck="false"></label>
    <label>管理令牌<input id="admin-token" type="password" autocomplete="off" placeholder="GEMINI_ADMIN_TOKEN"></label>
    <label class="check"><input id="remember-token" type="checkbox"> 在浏览器中长期记住管理令牌</label>
    <label>账号名称<input id="account-id" value="default" maxlength="64" spellcheck="false" placeholder="例如 work、personal"></label>
    <label>Google 账号序号<input id="auth-user" type="number" min="0" max="20" value="0"></label>
    <label>轮换权重<input id="weight" type="number" min="1" max="100" value="1"></label>
    <label class="check"><input id="auto-sync" type="checkbox"> 每 30 分钟自动同步已保存账号</label>
    <button id="sync" type="button">验证并同步</button>
    <button id="sync-all" class="secondary" type="button">立即同步全部账号</button>
    <div id="accounts" class="accounts"></div>
    <p id="status">请先在 gemini.google.com 登录目标账号。</p>
    <aside>每个账号会独立保存和轮换。Cookie 只会发送到 127.0.0.1 或 localhost，不会上传到第三方服务器。</aside>
  </main>
  <script src="popup.js"></script>
</body>
</html>
