name: Bug report
description: Report a reproducible gateway problem without credentials
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include Google Cookies, API keys, account email addresses, or unsanitized logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.4.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows x86_64, Linux x86_64, Linux ARM64, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: sanitization
    attributes:
      label: Credential safety
      options:
        - label: I removed all Cookies, API keys, account details, and sensitive URLs.
          required: true
