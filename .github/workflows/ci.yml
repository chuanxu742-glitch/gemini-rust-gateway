name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev perl golang
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Check frontend and smoke scripts
        run: |
          node --check web/app.js
          node --check chrome-extension/popup.js
          node --check chrome-extension/background.js
          python3 -m json.tool chrome-extension/manifest.json >/dev/null
          bash -n scripts/smoke-test.sh
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Reject committed secrets
        run: |
          if git grep -nE '(GEMINI_SECURE_1PSID|__Secure-[13]PSID)[=:][[:space:]]*[A-Za-z0-9._/-]{24,}' -- ':!*.example' ':!README.md'; then
            echo "Potential Google session credential committed"
            exit 1
          fi
