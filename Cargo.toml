[package]
name = "gemini-rust-gateway"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Native Rust Gemini Web gateway with an OpenAI-compatible API"
readme = "README.md"
keywords = ["gemini", "gateway", "openai", "axum", "rust"]
categories = ["web-programming::http-server", "api-bindings"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "macros"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures-util = "0.3"
mime_guess = "2"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { package = "wreq", version = "6.0.0-rc.29", features = ["brotli", "charset", "cookies", "deflate", "form", "gzip", "json", "query", "stream", "zstd"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["cors", "fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wreq-util = "3.0.0-rc.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
btls-sys = { path = "vendor/btls-sys" }
