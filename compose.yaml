services:
  gateway:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.auth.local
    environment:
      GEMINI_HOST: 0.0.0.0
      GEMINI_PUBLIC_BASE_URL: http://127.0.0.1:8000
      GEMINI_REMOTE_ADMIN_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gateway-data:/data

volumes:
  gateway-data:
